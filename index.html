<!doctype html>
<html lang="ar" dir="rtl">
<head>

<style>

<title>جيبتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: iOS-style grouped app — solid brand navbar, grey canvas, white grouped cards, fixed quick-entry bar on the main screen, bottom sheets */
:root {
  --brand: #6BC43F;
  --on-brand: #FFFFFF;
  --bg: #EFEFF4;
  --surface: #FFFFFF;
  --ink: #1F2420;
  --muted: #8A8F8B;
  --line: #E3E4E8;
  --track: #DADBDF;
  --red: #E2463F;
  --amber: #E39A12;
  --pill: #D2D3D7;
  --f-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D0E0D; --surface: #1B1C1B; --ink: #ECEDEC; --muted: #8E928E; --line: #2B2C2B; --track: #343534; --pill: #3A3B3A; --red: #F0645C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D0E0D; --surface: #1B1C1B; --ink: #ECEDEC; --muted: #8E928E; --line: #2B2C2B; --track: #343534; --pill: #3A3B3A; --red: #F0645C;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--brand); }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

#app { max-width: 600px; margin: 0 auto; min-height: 100vh; background: var(--bg); }
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--brand); color: var(--on-brand);
  padding: 10px max(14px, env(safe-area-inset-right, 0px)) 10px max(14px, env(safe-area-inset-left, 0px)); }
.nav-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 36px; }
.nav-row > :first-child { justify-self: start; }
.nav-row > :last-child { justify-self: end; }
.nav h1 { margin: 0; font-size: 19px; font-weight: 700; text-align: center; }
.nav .ib { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; }
.nav .back { display: flex; align-items: center; gap: 2px; font-size: 15px; font-weight: 500; }
.chips { display: flex; justify-content: space-between; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
.chipgrp { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.chip { background: var(--on-brand); color: var(--brand); border-radius: 99px; padding: 2px 6px 2px 12px; font-weight: 700; display: flex; align-items: center; gap: 4px; font-size: 14px; min-height: 28px; }
.chip svg.i { width: 16px; height: 16px; stroke-width: 2.4; }

.wrap { padding: 0 max(0px, env(safe-area-inset-right, 0px)) 24px max(0px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
.wrap.main { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
.card { background: var(--surface); border-block: 1px solid var(--line); }
.pad { padding: 12px 16px; }
.inset { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.period { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.period h2 { margin: 0; font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.period .sub { font-size: 12px; color: var(--muted); }
.period .nav2 { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.period .arrows { display: flex; gap: 2px; }
.period .arrows button { width: 32px; height: 28px; display: grid; place-items: center; color: var(--muted); border-radius: 8px; }
.period .arrows button[disabled] { opacity: .3; }
.stats3 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; text-align: center; border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; }
.stats3 b { display: block; font-size: 17px; font-weight: 700; }
.stats3 span { font-size: 12px; color: var(--muted); }
.stats3 .neg b { color: var(--red); }

.daycard .dh { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); }
.pill { background: var(--pill); color: var(--ink); border-radius: 99px; padding: 0 10px; font-size: 12px; font-weight: 600; min-width: 44px; text-align: center; }
.row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 11px 16px; text-align: start; border-top: 1px solid var(--line); min-height: 50px; }
.row:first-of-type { border-top: 0; }
.daycard .dh + .row { border-top: 0; }
.row:active { background: var(--bg); }
.row .ic { color: var(--muted); }
.row .t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row .t b { font-weight: 600; font-size: 15px; }
.row .t small { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .v { color: var(--brand); font-weight: 700; }
.row .v.red { color: var(--red); }
.row .chev { color: var(--track); width: 18px; height: 18px; }
.row .val { color: var(--brand); font-size: 14px; }
.sec-title { padding: 6px 16px 0; font-size: 13px; color: var(--muted); }
.empty { padding: 28px 20px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }

/* quick entry bar */
.qbar { position: fixed; z-index: 6; left: 0; right: 0; bottom: 0; max-width: 600px; margin: 0 auto; background: var(--bg); border-top: 1px solid var(--line);
  padding: 8px max(10px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
  display: grid; grid-template-columns: 96px 1fr 56px; gap: 8px; }
.qbar input, .qbar button { height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font: inherit; color: var(--ink); text-align: center; min-width: 0; }
.qbar #qPick { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 8px; }
.qbar #qPick.on { color: var(--ink); font-weight: 600; }
.qbar #qSave { display: grid; place-items: center; }
.qbar #qSave.on { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }

/* toggles + segmented */
.sw { width: 50px; height: 30px; border-radius: 99px; background: var(--track); position: relative; flex: none; transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 2px; right: 2px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: right .2s; }
.sw[aria-checked="true"] { background: var(--brand); }
.sw[aria-checked="true"]::after { right: 22px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--brand); border-radius: 8px; overflow: hidden; margin: 10px 16px 0; }
.seg button { padding: 6px; font-size: 14px; color: var(--brand); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); }

/* charts */
.chart-h { padding: 10px 16px; font-size: 14px; color: var(--muted); border-bottom: 1px solid var(--line); }
.donut-wrap { display: flex; align-items: center; justify-content: space-around; gap: 14px; padding: 16px; flex-wrap: wrap; }
.legend { display: flex; flex-direction: column; gap: 8px; font-size: 13px; min-width: 0; }
.legend div { display: flex; align-items: center; gap: 8px; }
.legend .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.legend .n { margin-inline-start: auto; font-weight: 600; padding-inline-start: 12px; }
.legend-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; padding: 0 16px 16px; font-size: 13px; }
.legend-grid div { display: flex; align-items: center; gap: 6px; min-width: 0; }
.legend-grid .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
.legend-grid span.l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend-grid .n { margin-inline-start: auto; color: var(--muted); }
.bars { padding: 12px 16px 6px; }
.bars svg { width: 100%; height: 130px; display: block; }
.bars .ax { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; }

/* goals */
.goal { display: block; width: 100%; text-align: start; padding: 12px 16px; border-top: 1px solid var(--line); }
.goal:first-of-type { border-top: 0; }
.goal .gh { display: flex; align-items: center; gap: 6px; font-weight: 700; }
.goal .gh .ok { color: var(--brand); }
.goal .gl { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 6px; }
.track { height: 4px; border-radius: 99px; background: var(--track); overflow: hidden; margin: 3px 0; }
.track i { display: block; height: 100%; background: var(--brand); border-radius: inherit; }
.goal .gv { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; }
.goal .gv small { color: var(--muted); font-weight: 400; }
.btn-out { display: block; width: calc(100% - 32px); margin: 0 16px; padding: 7px; border: 1px solid var(--track); border-radius: 6px; font-size: 13px; color: var(--muted); text-align: center; background: var(--surface); }

/* weekly */
.weeks { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px 8px; position: relative; }
.weeks::before { content: ""; position: absolute; left: 30px; right: 30px; top: 24px; height: 2px; background: var(--track); }
.weeks button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
.weeks button i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--track); background: var(--surface); }
.weeks button[aria-pressed="true"] { color: var(--brand); font-weight: 700; }
.weeks button[aria-pressed="true"] i { border-color: var(--brand); background: var(--brand); }
.weeks button.past i { border-color: var(--brand); }

/* sheets */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 30; }
.sheet { position: fixed; z-index: 31; left: 0; right: 0; bottom: 0; max-width: 600px; margin: 0 auto; background: var(--bg); border-radius: 14px 14px 0 0;
  max-height: 88vh; overflow-y: auto; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); animation: up .2s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: .5; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } .sw, .sw::after { transition: none; } }
.sheet-h { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 1; }
.sheet-h b { font-size: 16px; }
.sheet-h > :first-child { justify-self: start; color: var(--brand); font-weight: 600; }
.sheet-h > :last-child { justify-self: end; color: var(--brand); font-weight: 700; }
.form { display: flex; flex-direction: column; gap: 14px; padding: 14px 0; }
.f { display: flex; align-items: center; gap: 10px; background: var(--surface); border-block: 1px solid var(--line); padding: 4px 16px; min-height: 48px; }
.f label { flex: none; width: 110px; font-weight: 600; font-size: 14px; }
.f input, .f select { flex: 1; min-width: 0; border: 0; background: none; font: inherit; font-size: 16px; color: var(--ink); padding: 10px 0; }
.qbar input { font-size: 16px; }
.ta { margin: 0 16px; width: calc(100% - 32px); min-height: 170px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font: 16px/1.4 ui-monospace, Menlo, Consolas, monospace; padding: 10px; direction: ltr; }
.f input:focus { outline: none; }
.f .pickbtn { flex: 1; text-align: start; padding: 10px 0; color: var(--brand); font-weight: 600; }
.big-amt { font-size: 28px; font-weight: 700; text-align: center; }
.hint { padding: 0 16px; font-size: 12px; color: var(--muted); margin: 0; }
.err { padding: 0 16px; font-size: 13px; color: var(--red); margin: 0; min-height: 1em; }
.danger { display: block; width: 100%; background: var(--surface); border-block: 1px solid var(--line); color: var(--red); padding: 13px; font-weight: 600; }
.catgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border-block: 1px solid var(--line); }
.catgrid button { background: var(--surface); padding: 16px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; }
.catgrid button svg.i { color: var(--brand); width: 26px; height: 26px; }
.iconpick { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; padding: 10px 16px; background: var(--surface); border-block: 1px solid var(--line); }
.iconpick button { aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; border-radius: 10px; color: var(--muted); }
.iconpick button[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); }
.colors { display: flex; gap: 10px; flex-wrap: wrap; }
.colors button { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
.colors button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }

/* lock */
.lock { position: fixed; inset: 0; z-index: 50; background: var(--brand); color: var(--on-brand); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 20px; }
.lock h2 { margin: 0; font-size: 20px; }
.dots { display: flex; gap: 16px; direction: ltr; }
.dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--on-brand); }
.dots i.f { background: var(--on-brand); }
.keys { display: grid; grid-template-columns: repeat(3, 72px); gap: 14px; direction: ltr; }
.keys button { height: 72px; border-radius: 50%; background: rgba(255,255,255,.18); font-size: 26px; font-weight: 600; color: var(--on-brand); }
.keys button:empty { visibility: hidden; }
.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

.toast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 18px; border-radius: 99px; font-size: 14px; font-weight: 600; white-space: nowrap; }
/* status card + debts */
.status { padding-block: 14px; display: flex; flex-direction: column; gap: 10px; }
.st-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.phase { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 99px; background: color-mix(in srgb, var(--brand) 15%, transparent); color: var(--brand); }
.st-link { color: var(--brand); font-weight: 700; font-size: 14px; }
.st-big { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.st-big small { color: var(--muted); font-size: 14px; }
.st-big b { font-size: 34px; font-weight: 700; line-height: 1.1; }
.st-big b.neg { color: var(--red); }
.st-sub { font-size: 13px; color: var(--muted); }
.st-msg { font-size: 14px; font-weight: 600; padding: 8px 12px; border-radius: 10px; }
.st-msg.ok { background: color-mix(in srgb, var(--brand) 12%, transparent); }
.st-msg.warn { background: color-mix(in srgb, var(--amber) 18%, transparent); }
.st-msg.bad { background: color-mix(in srgb, var(--red) 12%, transparent); color: var(--red); }
.pays { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.pay { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.pay:last-child { border-bottom: 0; }
.pay .w { display: block; font-size: 12px; color: var(--muted); }
.pay .w.late { color: var(--red); font-weight: 600; }
.pbtn { background: var(--brand); color: var(--on-brand); border-radius: 8px; padding: 5px 12px; font-weight: 700; font-size: 13px; }
.st-debts { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; width: 100%; text-align: start; }
.st-debts > span:last-child { display: flex; align-items: center; gap: 2px; color: var(--muted); }
.st-debts b { color: var(--brand); }
.st-debts .chev { width: 18px; height: 18px; color: var(--track); }
.debt { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.debt:first-child { border-top: 0; }
.debt-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; text-align: start; }
.debt-h b { font-size: 16px; }
.tag { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 99px; background: var(--pill); color: var(--ink); white-space: nowrap; }
.tag.done { background: var(--brand); color: var(--on-brand); }
.debt-f { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.sched { display: grid; grid-template-columns: minmax(0, 1fr) 96px 32px; gap: 8px; }
.sched input { border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--bg); }
.sched.paid { opacity: .6; }
.x { color: var(--red); font-size: 20px; font-weight: 600; }
.st-today { font-size: 14px; }
.st-today b.neg { color: var(--red); }
.st-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.st-nav button { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 9px; border: 1px solid var(--line); border-radius: 10px; font-weight: 600; font-size: 14px; background: var(--bg); }
.st-nav svg.i { width: 18px; height: 18px; color: var(--brand); }
.fundpick { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.fundpick button { border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px; font-size: 13px; color: var(--ink); background: var(--bg); }
.fundpick button[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); border-color: var(--brand); font-weight: 700; }
.goal .gh svg.i { width: 18px; height: 18px; color: var(--muted); }
.ms { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; padding: 11px 16px; border-top: 1px solid var(--line); }
.ms:first-child { border-top: 0; }
.ms-k { font-size: 13px; font-weight: 700; color: var(--brand); }
.ms.late .ms-k { color: var(--amber); }
.ms.job .ms-k { color: var(--ink); }
.ms-t { display: flex; flex-direction: column; min-width: 0; }
.ms-t small { color: var(--amber); font-size: 12px; }
.prio-n { width: 24px; height: 24px; border-radius: 50%; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; font-size: 13px; font-weight: 700; flex: none; }
.prio button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); color: var(--muted); flex: none; }
.prio button[disabled] { opacity: .3; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px; }
.presets button { border: 1px solid var(--brand); color: var(--brand); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.tbl { overflow-x: auto; }
.tbl table { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th, .tbl td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: start; white-space: nowrap; }
.tbl th { color: var(--muted); font-weight: 600; }
.tbl td.up { color: var(--brand); font-weight: 700; }
.tbl td.down { color: var(--red); font-weight: 700; }
#wiForm .f { border-block: 0; border-top: 1px solid var(--line); }
#wiForm .f:first-child { border-top: 0; }
.foot { text-align: center; font-size: 12px; color: var(--muted); padding: 4px 16px; }
</style>
<style>
#auth { position: fixed; inset: 0; z-index: 70; background: var(--brand); display: flex; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
.auth-card { background: var(--surface); color: var(--ink); border-radius: 22px; padding: 26px 20px 18px; width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 10px; text-align: center; box-shadow: 0 20px 50px -20px rgba(0,0,0,.45); }
.auth-logo { width: 72px; height: 72px; border-radius: 18px; margin: 0 auto; }
.auth-card h2 { margin: 4px 0 0; font-size: 24px; }

<script type="module">
/* ---------- constants ---------- */
const ICONS = {

const UI_ICONS = {
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',

  left: '<path d="M14.5 6l-6 6 6 6"/>',
  right: '<path d="M9.5 6l6 6-6 6"/>',
  check: '<circle cx="12" cy="12" r="9" fill="currentColor" stroke="none"/><path d="M8 12.3l2.7 2.7L16 9.5" stroke="#fff" stroke-width="2"/>',
  plus: '<circle cx="12" cy="12" r="8.5"/><path d="M12 8.5v7M8.5 12h7"/>',
  swap: '<path d="M4 8.5h14l-3.5-3.5M20 15.5H6l3.5 3.5"/>',
  list: '<path d="M8 6.5h12M8 12h12M8 17.5h12M4 6.5h.01M4 12h.01M4 17.5h.01"/>',
  repeat: '<path d="M17 2.5l3 3-3 3M20 5.5H8a4 4 0 0 0-4 4V11M7 21.5l-3-3 3-3M4 18.5h12a4 4 0 0 0 4-4V13"/>',
  hash: '<path d="M5 9h14M5 15h14M10 4l-2 16M16 4l-2 16"/>',
  brush: '<path d="M18.5 3.5l2 2L11 15l-2-2zM9 13l2 2c0 3-2.5 5.5-6.5 5 .9-1 .9-2.5 1.5-4 .7-1.7 1.8-3 3-3z"/>',
  sound: '<path d="M9 18V5.5l11-2V16"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>',
  lockI: '<rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>',
  wallet: '<path d="M4 7.5h15a1.5 1.5 0 0 1 1.5 1.5v9.5A1.5 1.5 0 0 1 19 20H5.5A1.5 1.5 0 0 1 4 18.5zM4 7.5l11-4v4M16 14h1.5"/>',
  cloud: '<path d="M7 18.5a4.5 4.5 0 0 1-.5-9 6 6 0 0 1 11.5 1.5 3.8 3.8 0 0 1-.5 7.5z"/>',
  week: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  money: '<rect x="2.5" y="6" width="19" height="12" rx="1.5"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v5M18 9.5v5"/>',
};
const ic = (k, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24">${ICONS[k] || UI_ICONS[k] || ICONS.dots}</svg>`;

const DEFAULT_CATS = [
  { id: 'rest', n: 'مطعم', i: 'food', subs: ['فطور', 'غدا', 'عشاء', 'قهوة'] },
  { id: 'home', n: 'البيت', i: 'cart', subs: ['مقاضي', 'إيجار', 'كهربا وميّ', 'إنترنت'] },
  { id: 'car', n: 'سيارة', i: 'car', subs: ['بنزين', 'صيانة', 'تأمين', 'مواصلات'] },
  { id: 'me', n: 'أنا', i: 'phone', subs: ['فاتورة الجوال', 'ملابس', 'حلاقة', 'رياضة'] },
  { id: 'gift', n: 'هدايا', i: 'gift', subs: [] },
  { id: 'health', n: 'صحة', i: 'health', subs: ['دكتور', 'صيدلية'] },
  { id: 'fun', n: 'ترفيه', i: 'fun', subs: ['طلعات', 'سفر', 'اشتراكات'] },
  { id: 'edu', n: 'تعليم', i: 'book', subs: [] },
  { id: 'other', n: 'أخرى', i: 'dots', subs: [] },
];
const LEGACY = { food: 'rest', coffee: 'rest', transport: 'car', bills: 'home', shopping: 'me' };
const COLORS = { green: '#6BC43F', teal: '#17A898', blue: '#3B8FE0', purple: '#8C5BD6', pink: '#E0558E', orange: '#F08A24', graphite: '#4A504C' };
const PALETTE = ['#5BB0E3', '#F5C518', '#7DBA5C', '#E2463F', '#C77DBA', '#2D3A8C', '#F08A24', '#17A898', '#8C8F8C'];
const LOCAL_KEY = 'jaybti-local-v2';

/* ---------- state ---------- */
const defaults = () => ({ salaryDay: 1, income: 0, phase: 'search', allowance: 0, saveTarget: 0, jobStart: '', dateType: 'greg', digits: 'arab', color: 'green', sound: true, pin: '', cats: JSON.parse(JSON.stringify(DEFAULT_CATS)), commitments: [], budgets: {}, plan: {}, prio: [] });
let S = defaults();
let SAV = { moves: [], goals: [], debts: [], funds: [] };
let EXP = [];
let mode = 'loading';
const refs = {};
const ui = { screen: 'main', off: 0, tab: 'sum', week: null, pick: null, unlocked: false, open: {} };
let sheetCtx = null;

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const parseNum = s => { const n = parseFloat(String(s || '').trim().replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٫,]/g, '.')); return isFinite(n) ? n : NaN; };
const nu = () => S.digits === 'arab' ? 'arab' : 'latn';
const N = (n, dec = 2) => new Intl.NumberFormat('ar-u-nu-' + nu(), { maximumFractionDigits: dec }).format(Math.round((Number(n) || 0) * 100) / 100);
const Y = n => new Intl.NumberFormat('ar-u-nu-' + nu(), { useGrouping: false }).format(n);
const loc = () => S.dateType === 'hijri' ? `ar-u-ca-islamic-umalqura-nu-${nu()}` : `ar-u-nu-${nu()}`;
const fmtD = (d, o) => new Intl.DateTimeFormat(loc(), o).format(d);
const dmy = d => S.dateType === 'hijri' ? fmtD(d, { day: 'numeric', month: 'numeric', year: 'numeric' }) : `${Y(d.getDate())}/${Y(d.getMonth() + 1)}/${Y(d.getFullYear())}`;
const catOf = id => S.cats.find(c => c.id === (LEGACY[id] || id)) || { id, n: 'أخرى', i: 'dots', subs: [] };
const label = e => e.sub ? `${catOf(e.cat).n} / ${e.sub}` : catOf(e.cat).n;

/* ---------- periods (salary-day months) ---------- */
const clampDay = (y, m) => Math.min(S.salaryDay || 1, new Date(y, m + 1, 0).getDate());
function period(off) {
  const t = today();
  let y = t.getFullYear(), m = t.getMonth();
  if (t.getDate() < clampDay(y, m)) m--;
  const a = new Date(y, m + off, 1), b = new Date(y, m + off + 1, 1);
  const start = new Date(a.getFullYear(), a.getMonth(), clampDay(a.getFullYear(), a.getMonth()));
  const next = new Date(b.getFullYear(), b.getMonth(), clampDay(b.getFullYear(), b.getMonth()));
  const end = addDays(next, -1);
  const days = Math.round((next - start) / 864e5);
  return { start, end, from: iso(start), to: iso(end), days, cur: off === 0 };
}
// A salary month is named after the calendar month holding most of its days (27/10–26/11 is "November").
const pKey = p => iso(addDays(p.start, Math.floor(p.days / 2))).slice(0, 7);
const monthLabel = key => { const [y, m] = key.split('-').map(Number); return fmtD(new Date(y, m - 1, 15), S.dateType === 'hijri' ? { month: 'long', year: 'numeric' } : { month: 'long' }) + (S.dateType === 'hijri' ? '' : ' ' + Y(y)); };
const periodTitle = p => monthLabel(pKey(p));
function data(p) {
  const commit = (S.commitments || []).map(c => ({ id: 'c_' + c.id, cid: c.id, amount: Number(c.amount) || 0, cat: c.cat, sub: c.n, date: p.from, commit: true }));
  const exps = EXP.filter(e => typeof e.date === 'string' && e.date >= p.from && e.date <= p.to)
    .sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0));
  // Spending paid from a separate fund (e.g. the job-search fund) does not come out of the monthly income.
  const spentVar = exps.filter(e => !e.fund).reduce((s, e) => s + (Number(e.amount) || 0), 0);
  const commitTotal = commit.reduce((s, e) => s + e.amount, 0);
  const saving = SAV.moves.filter(m => m.date >= p.from && m.date <= p.to).reduce((s, m) => s + (m.type === 'in' ? 1 : -1) * (Number(m.amount) || 0), 0);
  const income = Number(S.income) || 0;
  const spent = spentVar + commitTotal;
  // Debt payments made in this period, and installments still owed by its end (overdue ones count in the current period).
  let debtPaid = 0, debtDue = 0;
  (SAV.debts || []).forEach(x => {
    (x.payments || []).forEach(m => { if (m.date >= p.from && m.date <= p.to) debtPaid += Number(m.amount) || 0; });
    (x.sched || []).forEach(s => { if (!s.paid && s.date <= p.to && (p.cur || s.date >= p.from)) debtDue += Number(s.amount) || 0; });
  });
  return { commit, exps, spentVar, commitTotal, spent, saving, income, debtPaid, debtDue, left: income - spent - saving - debtPaid };
}
const dPaid = x => (Number(x.paidBefore) || 0) + (x.payments || []).reduce((s, m) => s + (Number(m.amount) || 0), 0);
const dRem = x => Math.max(0, (Number(x.total) || 0) - dPaid(x));
const dNext = x => (x.sched || []).filter(s => !s.paid).sort((a, b) => a.date.localeCompare(b.date))[0];
const daysTo = s => Math.round((parseISO(s) - today()) / 864e5);
const whenTxt = s => { const n = daysTo(s); return n < 0 ? `متأخرة ${Y(-n)} يوم` : n === 0 ? 'اليوم' : n === 1 ? 'بكرة' : `بعد ${Y(n)} يوم`; };
const savTotal = () => SAV.moves.reduce((s, m) => s + (m.type === 'in' ? 1 : -1) * (Number(m.amount) || 0), 0);
const fundName = id => (SAV.funds || []).find(f => f.id === id)?.n || 'محذوف';
const fundSpent = id => EXP.filter(e => e.fund === id).reduce((s, e) => s + (Number(e.amount) || 0), 0);
const fundRem = f => (Number(f.amount) || 0) - fundSpent(f.id);
// A goal's balance is what was saved before tracking started plus every savings move tagged to it.
const goalSaved = g => (Number(g.saved) || 0) + SAV.moves.filter(m => m.goal === g.id).reduce((s, m) => s + (m.type === 'in' ? 1 : -1) * (Number(m.amount) || 0), 0);
const catSpent = (cat, p) => EXP.filter(e => !e.fund && catOf(e.cat).id === cat && e.date >= p.from && e.date <= p.to).reduce((s, e) => s + (Number(e.amount) || 0), 0);
function budgetNote(cat) {
  const b = Number((S.budgets || {})[cat]) || 0; if (!b) return '';
  const s = catSpent(cat, period(0)), n = catOf(cat).n;
  return s > b ? `تجاوزت ميزانية ${n} بـ ${N(s - b)}` : s >= b * .8 ? `وصلت ${Y(pct(s, b))}٪ من ميزانية ${n}` : '';
}
function weeks(p, d) {
  const perDay = Math.max(0, d.income - d.commitTotal - Math.max(0, d.saving) - d.debtPaid - d.debtDue) / p.days;
  const out = [];
  for (let i = 0; i * 7 < p.days; i++) {
    const s = addDays(p.start, i * 7), len = Math.min(7, p.days - i * 7), e = addDays(s, len - 1);
    const f = iso(s), t = iso(e);
    const spent = d.exps.filter(x => !x.fund && x.date >= f && x.date <= t).reduce((a, x) => a + (Number(x.amount) || 0), 0);
    out.push({ i, start: s, end: e, from: f, to: t, len, allow: perDay * len, spent });
  }
  return out;
}
const WEEK_NAMES = ['الأول', 'الثاني', 'الثالث', 'الرابع', 'الخامس'];

/* ---------- charts ---------- */
function ring(segs, size, stroke, center) {
  const r = (size - stroke) / 2, C = 2 * Math.PI * r, total = segs.reduce((s, x) => s + x.v, 0) || 1;
  let acc = 0;
  const arcs = segs.filter(s => s.v > 0).map(s => {
    const len = s.v / total * C;
    const el = `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${s.c}" stroke-width="${stroke}" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-acc}" transform="rotate(-90 ${size / 2} ${size / 2})"/>`;
    acc += len; return el;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${stroke}"/>${arcs}${center || ''}</svg>`;
}
const pct = (v, t) => t > 0 ? Math.round(v / t * 100) : 0;

/* ---------- screens ---------- */
function navBar(title, { back, left, right } = {}) {
  return `<header class="nav"><div class="nav-row">
    <div>${right || ''}</div><h1>${title}</h1>
    <div>${back ? `<button class="back" data-act="go" data-to="${back}">رجوع ${ic('left')}</button>` : (left || '')}</div>
  </div>`;
}
function periodHead(p, d) {
  const title = periodTitle(p);
  const leftDays = Math.round((p.end - today()) / 864e5) + 1;
  return `<div class="period"><div><h2>${ic('cal')}${title}</h2><div class="sub">(من ${dmy(p.start)} إلى ${dmy(p.end)})</div></div>
    <div class="nav2"><div class="arrows"><button data-act="per" data-d="-1" aria-label="الشهر السابق">${ic('right')}</button><button data-act="per" data-d="1" ${p.cur ? 'disabled' : ''} aria-label="الشهر التالي">${ic('left')}</button></div>
    <div class="sub">${p.cur ? `باقي ${Y(leftDays)} يوم` : (p.end < today() ? 'شهر منتهي' : '')}</div></div></div>`;
}

function scrMain() {
  const p = period(ui.off), d = data(p);
  const cw = period(0), cd = data(cw), wk = weeks(cw, cd).find(w => iso(today()) >= w.from && iso(today()) <= w.to);
  const wbal = wk ? wk.allow - wk.spent : 0;
  let html = navBar('جيبتي', {
    right: `<button class="ib" data-act="go" data-to="stats" aria-label="الإحصائيات">${ic('pie')}</button>`,
    left: `<button class="ib" data-act="go" data-to="settings" aria-label="الإعدادات">${ic('gear')}</button>`,
  });
  html += `<div class="chips"><div class="chipgrp">الرصيد <button class="chip num" data-act="go" data-to="weekly">${ic('left')}${N(wbal, 0)}</button></div>
    <div class="chipgrp">المدخرات <button class="chip num" data-act="go" data-to="savings">${ic('left')}${N(savTotal(), 0)}</button></div></div></header>`;
  html += `<div class="wrap main">${ui.off === 0 && mode !== 'loading' ? statusCard(p, d) : ''}<section class="card inset" style="padding-block:12px">${periodHead(p, d)}
    <div class="stats3"><div><b class="num">${N(d.spent)}</b><span>المصاريف</span></div>
    <div><b class="num">${N(d.debtPaid)}</b><span>سداد ديون</span></div>
    <div><b class="num">${N(d.saving)}</b><span>الادخار</span></div>
    <div class="${d.left < 0 ? 'neg' : ''}"><b class="num">${N(d.left)}</b><span>${d.income ? 'المتبقي من الدخل' : '<button data-act="income" style="color:var(--brand);font-size:12px;font-weight:600">حدد دخلك الشهري</button>'}</span></div></div></section>`;

  if (mode === 'loading') html += `<div class="foot">جاري التحميل…</div>`;
  else {
    const groups = [];
    d.exps.forEach(e => { const g = groups[groups.length - 1]; if (g && g.date === e.date) g.items.push(e); else groups.push({ date: e.date, items: [e] }); });
    if (d.commit.length) html += dayCard('الالتزامات الشهرية', d.commitTotal, d.commit);
    groups.forEach(g => {
      const dt = parseISO(g.date);
      html += dayCard(`${fmtD(dt, { weekday: 'long' })}  ${dmy(dt)}`, g.items.reduce((s, e) => s + (Number(e.amount) || 0), 0), g.items);

// "Where am I today": what can be spent per day after commitments, due installments and this month's saving target.
function statusCard(p, d) {
  const daysLeft = Math.round((p.end - today()) / 864e5) + 1;
  const reserve = Math.max(0, (Number(S.saveTarget) || 0) - Math.max(0, d.saving));
  // Money left at month end carries over, so installments due in the next 14 days are held back too.
  const horizon = [p.to, iso(addDays(today(), 14))].sort()[1];
  let due = 0;
  (SAV.debts || []).forEach(x => (x.sched || []).forEach(s => { if (!s.paid && s.date <= horizon) due += Number(s.amount) || 0; }));
  const avail = d.left - due - reserve;
  // Today's budget is fixed at the start of the day; spending today lowers "left today", not the budget itself.
  const t0 = iso(today());
  const spentToday = EXP.filter(e => e.date === t0 && !e.fund).reduce((s, e) => s + (Number(e.amount) || 0), 0);
  const perDay = (avail + spentToday) / Math.max(1, daysLeft);
  const leftToday = perDay - spentToday;
  let tone, msg;
  if (!d.income) { tone = 'warn'; msg = 'حدد دخلك الشهري من الإعدادات عشان أحسبلك قديش بتقدر تصرف'; }
  else if (avail < 0) { tone = 'bad'; msg = `الدفعات والالتزامات هالشهر أكثر من اللي معك بـ ${N(-avail)}. خفّف الطلعات أو أجّل إشي.`; }
  else if (leftToday < 0) { tone = 'warn'; msg = `صرفت اليوم أكثر من ميزانيته بـ ${N(-leftToday, 0)}، والفرق بيتوزّع على باقي الأيام.`; }
  else if (perDay < 20) { tone = 'warn'; msg = 'شهر ضيق، خلّي الصرف للضروري بس.'; }
  else { tone = 'ok'; msg = 'ماشي تمام، ضلّك على الخطة.'; }
  const ups = [];
  (SAV.debts || []).forEach(x => (x.sched || []).forEach(s => { if (!s.paid && daysTo(s.date) <= 45) ups.push({ x, s }); }));
  ups.sort((a, b) => a.s.date.localeCompare(b.s.date));
  const ds = SAV.debts || [], rem = ds.reduce((s, x) => s + dRem(x), 0), closed = ds.filter(x => dRem(x) <= 0).length;
  return `<section class="card status inset">
    <div class="st-top"><span class="phase">${S.phase === 'job' ? 'موظف' : 'مرحلة البحث عن عمل'}</span>${S.phase === 'job' ? '' : '<button class="st-link" data-act="job-sheet">وصلت للشغل!</button>'}</div>
    <div class="st-big"><small>بتقدر تصرف اليوم</small><b class="num ${perDay < 0 ? 'neg' : ''}">${N(Math.max(0, perDay), 0)}</b></div>
    ${spentToday ? `<div class="st-today">صرفت اليوم <b class="num">${N(spentToday)}</b> · ضايلّك اليوم <b class="num ${leftToday < 0 ? 'neg' : ''}">${N(leftToday, 0)}</b></div>` : ''}
    <div class="st-sub">باقيلك لآخر الشهر <b class="num">${N(avail)}</b> لمدة ${Y(daysLeft)} يوم${due ? ` · محجوز للدفعات ${N(due)}` : ''}${reserve ? ` · للتوفير ${N(reserve)}` : ''}</div>
    <div class="st-msg ${tone}">${msg}</div>
    ${ups.length ? `<div class="pays">${ups.slice(0, 4).map(({ x, s }) => `<div class="pay"><span><b>${esc(x.n)}</b><span class="w ${daysTo(s.date) < 0 ? 'late' : ''}">${whenTxt(s.date)} · ${dmy(parseISO(s.date))}</span></span><span class="num" style="font-weight:700">${N(s.amount)}</span><button class="pbtn" data-act="pay" data-d="${esc(x.id)}" data-s="${esc(s.id)}">دفعت</button></div>`).join('')}</div>` : ''}
    <button class="st-debts" data-act="go" data-to="debts">${ds.length ? `<span>الديون: باقي <b class="num">${N(rem)}</b></span><span>سكّرت ${Y(closed)} من ${Y(ds.length)}${ic('left', 'i chev')}</span>` : `<span>سجّل ديونك عشان أذكّرك بمواعيدها</span><span>${ic('left', 'i chev')}</span>`}</button>
    <div class="st-nav"><button data-act="go" data-to="funds">${ic('wallet')}الصناديق</button><button data-act="go" data-to="plan">${ic('repeat')}خريطة الطريق</button></div>
  </section>`;
}
function dayCard(title, total, items) {

/* ---------- roadmap ---------- */
const planOf = () => ({ jobMonth: '', salary: 0, livingSearch: 300, livingJob: 1600, ...(S.plan || {}) });
// Goals and after-job debts, in the order savings flow to them. Default: the nearest goal first, then after-job debts, then the other goals.
function prioItems() {
  const goals = [...SAV.goals].sort((a, b) => (a.end || '9').localeCompare(b.end || '9'))
    .map(g => ({ kind: 'goal', id: g.id, n: g.n, end: g.end || '', need: Math.max(0, (Number(g.target) || 0) - goalSaved(g)) }));
  const debts = (SAV.debts || []).filter(x => x.afterJob).map(x => {
    const owed = (x.sched || []).filter(s => !s.paid).reduce((a, s) => a + (Number(s.amount) || 0), 0);
    return { kind: 'debt', id: x.id, n: x.n, need: Math.max(0, dRem(x) - owed) };
  });
  const def = goals.length ? [goals[0], ...debts, ...goals.slice(1)] : debts;
  const pr = S.prio || [];
  const rank = it => { const i = pr.indexOf(it.id); return i < 0 ? 1000 + def.indexOf(it) : i; };
  return def.sort((a, b) => rank(a) - rank(b));
}
// Month-by-month projection from next salary month: income minus commitments, living costs and due installments,
// with what is left flowing down the priority list. Current balances are the starting point, so real saving moves the dates.
function simulate(o = {}) {
  const P = { ...planOf(), extra: 0, ...o };
  const commit = (S.commitments || []).reduce((s, c) => s + (Number(c.amount) || 0), 0);
  const items = prioItems().map(it => ({ ...it, doneKey: it.need <= 0 ? 'done' : '' }));
  const sched = [];
  (SAV.debts || []).forEach(x => (x.sched || []).forEach(s => { if (!s.paid) sched.push({ x, s }); }));
  const lastDue = {};
  const months = [];
  for (let k = 1; k <= 60; k++) {
    const p = period(k), key = pKey(p);
    const job = S.phase === 'job' || (!!P.jobMonth && key >= P.jobMonth);
    const income = S.phase === 'job' ? Number(S.income) || 0 : job ? Number(P.salary) || 0 : Number(S.income) || 0;
    let due = 0;
    sched.forEach(({ x, s }) => { if (s.date >= p.from && s.date <= p.to) { due += Number(s.amount) || 0; lastDue[x.id] = key; } });
    let free = income + (Number(P.extra) || 0) - commit - (job ? P.livingJob : P.livingSearch) - due;
    months.push({ key, free, job });
    for (const it of items) {
      if (free <= 0) break;
      if (it.doneKey || (it.kind === 'debt' && !job)) continue;
      const take = Math.min(it.need, free); it.need -= take; free -= take;
      if (it.need <= 0.5) it.doneKey = key;
    }
    items.forEach(it => { if (it.kind === 'goal' && it.end === key && it.doneKey !== 'done' && (!it.doneKey || it.doneKey > key)) it.short = it.need; });
  }
  const nowKey = pKey(period(0));
  sched.forEach(({ x, s }) => { if (s.date <= period(0).to) lastDue[x.id] = lastDue[x.id] || nowKey; });
  const schedDone = (SAV.debts || []).filter(x => lastDue[x.id] && !x.afterJob).map(x => ({ n: x.n, key: lastDue[x.id] }));
  // Typical monthly saving, before installments: what a normal month leaves over.
  const extra = Number(P.extra) || 0;
  const freeSearch = S.phase === 'job' ? null : (Number(S.income) || 0) + extra - commit - P.livingSearch;
  const freeJob = S.phase === 'job' ? (Number(S.income) || 0) + extra - commit - P.livingJob : P.jobMonth && P.salary ? Number(P.salary) + extra - commit - P.livingJob : null;
  return { items, schedDone, jobKey: S.phase === 'job' ? '' : P.jobMonth || '', freeSearch, freeJob, months };
}
function milestones(sim) {
  const ev = [], nowKey = pKey(period(0));
  sim.schedDone.forEach(s => ev.push({ key: s.key, txt: `تسكير دين ${s.n}` }));
  if (sim.jobKey) ev.push({ key: sim.jobKey, txt: 'بداية الشغل (متوقع)', job: true });
  sim.items.forEach(it => {
    const nm = it.kind === 'goal' ? `هدف ${it.n}` : `دين ${it.n}`;
    if (it.doneKey === 'done') ev.push({ key: nowKey, txt: it.kind === 'goal' ? `${nm} مكتمل` : `${nm} مسكّر` });
    else if (it.doneKey) {
      const late = it.kind === 'goal' && it.end && it.doneKey > it.end;
      ev.push({ key: it.doneKey, txt: it.kind === 'goal' ? `${nm} بيكتمل` : `تسكير ${nm}`, late: late ? `متأخر عن موعده (${monthLabel(it.end)})، وقتها بيكون ناقصك ${N(it.short || 0)}` : '' });
    } else ev.push({ key: '9999-99', txt: nm, never: true, late: 'ما بيكتمل خلال ٥ سنين بالأرقام الحالية' });
  });
  return ev.sort((a, b) => a.key.localeCompare(b.key));
}
function scrPlan() {
  const P = planOf(), sim = simulate();
  let html = navBar('خريطة الطريق', { back: 'main' }) + `</header><div class="wrap" style="margin-top:14px">`;

  html += `<button class="btn-out" data-act="go" data-to="whatif">شو لو…؟ جرّب سيناريو</button>`;
  return html + `</div>`;
}
function whatifOut() {

/* ---------- PIN lock ---------- */
let pinBuf = '', pinMode = null, pinFirst = '';
async function hash(s) {
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('jaybti:' + s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch (e) { return 'p:' + s; }
}
function renderLock() {
  const need = (S.pin && !ui.unlocked && mode !== 'loading') || pinMode;
  const L = $('lock'); L.hidden = !need; if (!need) return;
  const title = pinMode === 'set1' ? 'اختار رمز سري من ٤ أرقام' : pinMode === 'set2' ? 'أعد كتابة الرمز' : 'اكتب الرمز السري';
  L.innerHTML = `<h2>${title}</h2><div class="dots" id="pinDots">${[0, 1, 2, 3].map(i => `<i class="${i < pinBuf.length ? 'f' : ''}"></i>`).join('')}</div>
    <div class="keys">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '', 0, '⌫'].map(k => `<button data-act="pin-key" data-k="${k}">${k === '' ? '' : (typeof k === 'number' ? Y(k) : k)}</button>`).join('')}</div>
    ${pinMode ? `<button data-act="pin-cancel" style="color:var(--on-brand);font-weight:600">إلغاء</button>` : ''}`;
}
async function pinKey(k) {
  if (k === '⌫') pinBuf = pinBuf.slice(0, -1); else if (pinBuf.length < 4) pinBuf += k;
  renderLock();
  if (pinBuf.length < 4) return;
  const entered = pinBuf; pinBuf = '';
  if (pinMode === 'set1') { pinFirst = entered; pinMode = 'set2'; renderLock(); return; }
  if (pinMode === 'set2') {
    if (entered === pinFirst) { S.pin = await hash(entered); pinMode = null; ui.unlocked = true; await saveSettings(); toast('انحفظ الرمز السري'); render(); }
    else { pinMode = 'set1'; renderLock(); shakeDots(); }
    return;
  }
  if (await hash(entered) === S.pin) { ui.unlocked = true; render(); } else { renderLock(); shakeDots(); }
}
const shakeDots = () => { const d = $('pinDots'); if (d) { d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); } };

/* ---------- sound ---------- */
let actx;
function ding() {
  if (!S.sound) return;
  try {
    actx ||= new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = 'sine'; o.frequency.setValueAtTime(880, t); o.frequency.exponentialRampToValueAtTime(1320, t + .08);
    g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + .22);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + .25);
  } catch (e) {}
}

    }, fail));
    unsubs.push(onSnapshot(doc(fsdb, 'users', user.uid, 'meta', 'savings'), s => {
      if (s.exists()) { const d = s.data(); SAV = { moves: Array.isArray(d.moves) ? d.moves : [], goals: Array.isArray(d.goals) ? d.goals : [], debts: Array.isArray(d.debts) ? d.debts : [], funds: Array.isArray(d.funds) ? d.funds : [] }; }
      ready('v');
    }, fail));
    unsubs.push(onSnapshot(collection(fsdb, 'users', user.uid, 'expenses'), q => {
      EXP = q.docs.map(d => ({ id: d.id, ...d.data() }));
      ready('e');
    }, fail));
  });
}

/* ---------- actions ---------- */
const A = {
  go: b => { if (b.dataset.to === 'whatif') ui.wi = null; ui.screen = b.dataset.to; if (b.dataset.to === 'main' || b.dataset.to === 'stats') {} else ui.off = ui.screen === 'weekly' ? 0 : ui.off; ui.week = null; render(); window.scrollTo(0, 0); },
  per: b => { ui.off = Math.min(0, ui.off + Number(b.dataset.d)); render(); },
  tab: b => { ui.tab = b.dataset.t; render(); },
  toggle: b => { ui.open[b.dataset.k] = !ui.open[b.dataset.k]; render(); },
  wk: b => { ui.week = Number(b.dataset.i); render(); },
  close: () => {
    if (sheetCtx?.kind === 'pick' && sheetCtx.back?.kind === 'exp') return expSheet(sheetCtx.back.id ? EXP.find(x => x.id === sheetCtx.back.id) : null, sheetCtx.back.draft);
    closeSheet();
  },
  'pick-open': b => {
    const back = b.dataset.for === 'edit' ? { kind: 'exp', id: sheetCtx.id, draft: readExpDraft() } : null;
    const fund = back ? back.draft.fund || '' : ui.pick?.fund || '';
    sheetCtx = back; pickerSheet(b.dataset.for, null, fund); sheetCtx.kind = 'pick'; sheetCtx.back = back;
  },
  'pick-fund': b => { sheetCtx.fund = b.dataset.f; document.querySelectorAll('.fundpick button').forEach(x => x.setAttribute('aria-pressed', x === b)); },
  'pick-cat': b => {
    const c = catOf(b.dataset.id), ctx = sheetCtx;
    if (c.subs.length) { pickerSheet(ctx.forWhat, c.id); sheetCtx.kind = 'pick'; sheetCtx.back = ctx.back; sheetCtx.fund = ctx.fund; }
    else A.__picked(ctx, c.id, '');
  },
  'pick-sub': b => A.__picked(sheetCtx, b.dataset.cat, b.dataset.sub),
  __picked: (ctx, cat, sub) => {
    const fund = ctx.fund || '';
    if (ctx.forWhat === 'bar') { ui.pick = { cat, sub, fund }; closeSheet(); render(); if (!(parseNum($('qAmt').value) > 0)) $('qAmt').focus(); }
    else { const d = ctx.back.draft; d.cat = cat; d.sub = sub; d.fund = fund; expSheet(ctx.back.id ? EXP.find(x => x.id === ctx.back.id) : null, d); }
  },
  'quick-save': async () => {
    const amount = parseNum($('qAmt').value);
    if (!(amount > 0)) { toast('اكتب المبلغ أول'); $('qAmt').focus(); return; }
    if (!ui.pick) return A['pick-open']({ dataset: { for: 'bar' } });
    const p = period(ui.off), t = iso(today());
    const date = t >= p.from && t <= p.to ? t : p.from;
    const pk = ui.pick;
    try {
      await putExp(null, { amount: Math.round(amount * 100) / 100, cat: pk.cat, sub: pk.sub, fund: pk.fund || '', note: '', date, createdAt: Date.now() });
      ding(); $('qAmt').value = ''; ui.pick = null; render();
      const note = pk.fund ? `باقي بصندوق ${fundName(pk.fund)}: ${N(fundRem(SAV.funds.find(f => f.id === pk.fund) || {}))}` : budgetNote(catOf(pk.cat).id);
      if (note) setTimeout(() => toast(note), 400);
    }
    catch (e) { toast('ما انحفظ. تأكد من النت'); }
  },
  'exp-edit': b => expSheet(EXP.find(x => x.id === b.dataset.id)),
  'exp-save': async () => {
    const d = readExpDraft(), amount = parseNum(d.amount);
    if (!(amount > 0)) return err('اكتب مبلغ أكبر من صفر');
    if (!d.cat) return err('اختار بند الصرف');
    const prev = sheetCtx.id ? EXP.find(x => x.id === sheetCtx.id) : null;
    try { await putExp(sheetCtx.id, { amount: Math.round(amount * 100) / 100, cat: d.cat, sub: d.sub, fund: d.fund || '', note: d.note.trim(), date: d.date || iso(today()), createdAt: prev?.createdAt || Date.now() }); closeSheet(); toast(budgetNote(catOf(d.cat).id) || 'انحفظ'); }
    catch (e) { err('ما انحفظ. تأكد من النت وجرب كمان مرة'); }
  },
  'exp-del': async b => {
    if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'اكبس كمان مرة للتأكيد'; return; }
    try { await delExp(sheetCtx.id); closeSheet(); toast('انحذف'); } catch (e) { err('ما انحذف. جرب كمان مرة'); }
  },
  move: b => moveSheet(b.dataset.type),
  'move-edit': b => { const m = SAV.moves.find(x => x.id === b.dataset.id); if (m) moveSheet(m.type, m); },
  'move-save': async () => {
    const amount = parseNum($('mAmt').value); if (!(amount > 0)) return err('اكتب مبلغ أكبر من صفر');
    const m = { id: sheetCtx.id || uid(), type: sheetCtx.type, amount: Math.round(amount * 100) / 100, date: $('mDate').value || iso(today()), note: $('mNote').value.trim(), goal: $('mGoal')?.value || '' };
    SAV.moves = sheetCtx.id ? SAV.moves.map(x => x.id === m.id ? m : x) : [...SAV.moves, m];
    closeSheet(); ding(); try { await saveSav(); } catch (e) { toast('ما انحفظ'); }
  },
  'move-del': async b => {
    if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'اكبس كمان مرة للتأكيد'; return; }
    SAV.moves = SAV.moves.filter(x => x.id !== sheetCtx.id); closeSheet(); try { await saveSav(); } catch (e) {}
  },
  'goal-edit': b => goalSheet(b.dataset.id ? SAV.goals.find(g => g.id === b.dataset.id) : null),
  'goal-save': async () => {
    const n = $('gN').value.trim(), target = parseNum($('gT').value), saved = parseNum($('gS').value || '0');
    if (!n) return err('اكتب اسم الهدف'); if (!(target > 0)) return err('اكتب المبلغ المطلوب'); if (!(saved >= 0)) return err('اللي جمعته لازم يكون رقم');
    if ($('gA').value && $('gB').value && $('gB').value < $('gA').value) return err('شهر النهاية لازم يكون بعد شهر البداية');
    const g = { id: sheetCtx.id || uid(), n, target, saved, start: $('gA').value, end: $('gB').value };
    SAV.goals = sheetCtx.id ? SAV.goals.map(x => x.id === g.id ? g : x) : [...SAV.goals, g];
    closeSheet(); try { await saveSav(); } catch (e) { toast('ما انحفظ'); }
  },
  'goal-del': async b => {
    if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'اكبس كمان مرة للتأكيد'; return; }
    SAV.goals = SAV.goals.filter(x => x.id !== sheetCtx.id); closeSheet(); try { await saveSav(); } catch (e) {}
  },
  'cat-edit': b => catSheet(b.dataset.id ? S.cats.find(c => c.id === b.dataset.id) : null),
  'cat-icon': b => { sheetCtx.icon = b.dataset.i; document.querySelectorAll('#cI button').forEach(x => x.setAttribute('aria-pressed', x === b)); },
  'cat-save': async () => {
    const n = $('cN').value.trim(); if (!n) return err('اكتب اسم البند');
    const subs = $('cS').value.split(/[،,]/).map(s => s.trim()).filter(Boolean);
    const c = { id: sheetCtx.id || 'c' + uid(), n, i: sheetCtx.icon, subs };
    const bv = parseNum($('cB').value);
    S.budgets = { ...(S.budgets || {}) }; if (bv > 0) S.budgets[c.id] = bv; else delete S.budgets[c.id];
    S.cats = sheetCtx.id ? S.cats.map(x => x.id === c.id ? c : x) : [...S.cats, c];
    closeSheet(); try { await saveSettings(); } catch (e) { toast('ما انحفظ'); }
  },
  'cat-del': async b => {
    if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'المصاريف القديمة بتنحسب "أخرى". اكبس للتأكيد'; return; }
    S.cats = S.cats.filter(x => x.id !== sheetCtx.id); closeSheet(); try { await saveSettings(); } catch (e) {}
  },
  'commit-edit': b => commitSheet(b.dataset.id ? S.commitments.find(c => c.id === b.dataset.id) : null),
  'commit-save': async () => {
    const n = $('kN').value.trim(), amount = parseNum($('kA').value);
    if (!n) return err('اكتب اسم الالتزام'); if (!(amount > 0)) return err('اكتب المبلغ الشهري');
    const c = { id: sheetCtx.id || uid(), n, amount, cat: $('kC').value };
    S.commitments = sheetCtx.id ? S.commitments.map(x => x.id === c.id ? c : x) : [...S.commitments, c];
    closeSheet(); try { await saveSettings(); } catch (e) { toast('ما انحفظ'); }
  },
  'commit-del': async b => {
    if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'اكبس كمان مرة للتأكيد'; return; }
    S.commitments = S.commitments.filter(x => x.id !== sheetCtx.id); closeSheet(); try { await saveSettings(); } catch (e) {}
  },
  income: () => numSheet('الدخل الشهري', 'income', S.income, 'راتبك أو مجموع دخلك بالشهر. منه بينحسب المتبقي والرصيد الأسبوعي.'),
  salary: () => salarySheet(),
  'num-save': async () => {
    const v = parseNum($('nV').value);
    if (sheetCtx.key === 'income' && !(v >= 0)) return err('اكتب رقم');
    S[sheetCtx.key] = sheetCtx.key === 'salaryDay' ? Math.min(28, Math.max(1, Math.round(v))) : (v || 0);
    closeSheet(); try { await saveSettings(); } catch (e) { toast('ما انحفظ'); }
  },
  cycle: b => { const k = b.dataset.k; S[k] = k === 'dateType' ? (S.dateType === 'hijri' ? 'greg' : 'hijri') : (S.digits === 'arab' ? 'latn' : 'arab'); saveSettings().catch(() => toast('ما انحفظ')); },
  color: b => { S.color = b.dataset.c; saveSettings().catch(() => toast('ما انحفظ')); },
  sw: b => { S[b.dataset.k] = !S[b.dataset.k]; saveSettings().catch(() => toast('ما انحفظ')); if (S.sound && b.dataset.k === 'sound') ding(); },
  'pin-toggle': async () => {
    if (S.pin) { S.pin = ''; try { await saveSettings(); toast('انشال الرمز السري'); } catch (e) {} }
    else { pinMode = 'set1'; pinBuf = ''; renderLock(); }
  },
  'debt-edit': b => debtSheet(b.dataset.id ? (SAV.debts || []).find(x => x.id === b.dataset.id) : null),
  'debt-afterjob': b => { sheetCtx.afterJob = !sheetCtx.afterJob; b.setAttribute('aria-checked', sheetCtx.afterJob); },
  'sched-add': () => { $('schedRows').insertAdjacentHTML('beforeend', schedRow({ id: uid(), date: '', amount: '' })); },
  'sched-del': b => b.closest('.sched').remove(),
  'debt-save': async () => {
    const n = $('dN').value.trim(), total = parseNum($('dT').value), pb = parseNum($('dP').value || '0');
    if (!n) return err('اكتب لمين الدين'); if (!(total > 0)) return err('اكتب المبلغ الكلي'); if (!(pb >= 0)) return err('"دفعت منه قبل" لازم يكون رقم');
    const sched = [];
    for (const r of document.querySelectorAll('#schedRows .sched')) {
      const date = r.querySelector('.sD').value, raw = r.querySelector('.sA').value.trim(), amount = parseNum(raw);
      if (!date && !raw) continue;
      if (!date || !(amount > 0)) return err('كل دفعة بدها تاريخ ومبلغ');
      sched.push({ id: r.dataset.sid, date, amount: Math.round(amount * 100) / 100, paid: r.dataset.paid === '1' });
    }
    sched.sort((a, b) => a.date.localeCompare(b.date));
    const prev = sheetCtx.id ? SAV.debts.find(x => x.id === sheetCtx.id) : null;
    const x = { id: sheetCtx.id || uid(), n, total, paidBefore: pb, afterJob: sheetCtx.afterJob, sched, payments: prev?.payments || [] };
    SAV.debts = sheetCtx.id ? SAV.debts.map(y => y.id === x.id ? x : y) : [...(SAV.debts || []), x];
    closeSheet(); try { await saveSav(); toast('انحفظ'); } catch (e) { toast('ما انحفظ'); }
  },
  'debt-del': async b => {
    if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'اكبس كمان مرة للتأكيد'; return; }
    SAV.debts = SAV.debts.filter(x => x.id !== sheetCtx.id); closeSheet(); try { await saveSav(); } catch (e) {}
  },
  pay: b => { const x = (SAV.debts || []).find(y => y.id === b.dataset.d); if (x) paySheet(x, (x.sched || []).find(s => s.id === b.dataset.s)); },
  'pay-save': async () => {
    const amount = parseNum($('pA').value); if (!(amount > 0)) return err('اكتب المبلغ');
    const x = SAV.debts.find(y => y.id === sheetCtx.id); if (!x) return closeSheet();
    x.payments = [...(x.payments || []), { id: uid(), date: $('pD').value || iso(today()), amount: Math.round(amount * 100) / 100, note: $('pN').value.trim(), sid: sheetCtx.sid }];
    if (sheetCtx.sid) x.sched = (x.sched || []).map(s => s.id === sheetCtx.sid ? { ...s, paid: true } : s);
    const closed = dRem(x) <= 0;
    closeSheet(); ding(); try { await saveSav(); toast(closed ? `مبروك! سكّرت دين ${x.n}` : 'انسجّلت الدفعة'); } catch (e) { toast('ما انحفظ'); }
  },
  'pay-del': async b => {
    if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'متأكد؟'; return; }
    const x = SAV.debts.find(y => y.id === sheetCtx.id); if (!x) return;
    const m = (x.payments || []).find(p => p.id === b.dataset.p);
    x.payments = (x.payments || []).filter(p => p.id !== b.dataset.p);
    if (m?.sid) x.sched = (x.sched || []).map(s => s.id === m.sid ? { ...s, paid: false } : s);
    try { await saveSav(); } catch (e) {}
    debtSheet(x);
  },
  'job-sheet': () => jobSheet(),
  'job-save': async () => {
    const v = parseNum($('jS').value); if (!(v > 0)) return err('اكتب الراتب');
    if (S.phase !== 'job') S.allowance = S.income;
    S.income = v; S.phase = 'job'; S.jobStart = $('jD').value || iso(today());
    closeSheet(); ding(); try { await saveSettings(); toast('مبروك! الخطة اتحدّثت'); } catch (e) { toast('ما انحفظ'); }
  },
  phase: () => S.phase === 'job'
    ? openSheet(sheetHead('المرحلة') + `<div class="form"><p class="hint" style="font-size:15px;color:var(--ink)">إنت بمرحلة الشغل${S.jobStart ? ' من ' + dmy(parseISO(S.jobStart)) : ''}، والراتب <span class="num">${N(S.income)}</span>.</p><button class="btn-out" data-act="job-sheet">تعديل الراتب</button><button class="danger" data-act="job-undo">رجّعني لمرحلة البحث عن عمل</button></div>`, { kind: 'phase' })
    : jobSheet(),
  'job-undo': async b => {
    if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'اكبس كمان مرة للتأكيد'; return; }
    S.phase = 'search'; S.income = S.allowance || S.income; closeSheet(); try { await saveSettings(); } catch (e) {}
  },
  target: () => numSheet('التوفير الشهري', 'saveTarget', S.saveTarget, 'المبلغ اللي بدك تحطه على جنب كل شهر (مثلاً للسفرة). بحجزه من "بتقدر تصرف اليوم" لحد ما تسجّله كادخار من حساب المدخرات.'),
  'fund-edit': b => fundSheet(b.dataset.id ? (SAV.funds || []).find(f => f.id === b.dataset.id) : null),
  'fund-save': async () => {
    const n = $('fN').value.trim(), a = parseNum($('fA').value);
    if (!n) return err('اكتب اسم الصندوق'); if (!(a > 0)) return err('اكتب المبلغ');
    const f = { id: sheetCtx.id || uid(), n, amount: a };
    SAV.funds = sheetCtx.id ? SAV.funds.map(x => x.id === f.id ? f : x) : [...(SAV.funds || []), f];
    closeSheet(); try { await saveSav(); } catch (e) { toast('ما انحفظ'); }
  },
  'fund-del': async b => {
    if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'المصاريف اللي منه بتضل مسجلة. اكبس للتأكيد'; return; }
    SAV.funds = SAV.funds.filter(x => x.id !== sheetCtx.id); closeSheet(); try { await saveSav(); } catch (e) {}
  },
  'plan-edit': () => planSheet(),
  'plan-save': async () => {
    const g = id => $(id) ? parseNum($(id).value) : NaN;
    const a = g('plA'), b = g('plB');
    if (!(a >= 0) || !(b >= 0)) return err('المصروف لازم يكون رقم');
    S.plan = { ...planOf(), livingSearch: a, livingJob: b };
    if ($('plJ')) { S.plan.jobMonth = $('plJ').value; const s = g('plS'); S.plan.salary = s > 0 ? s : 0; }
    closeSheet(); try { await saveSettings(); } catch (e) { toast('ما انحفظ'); }
  },
  prio: async b => {
    const ids = prioItems().map(x => x.id), i = ids.indexOf(b.dataset.id), j = i + Number(b.dataset.d);
    if (i < 0 || j < 0 || j >= ids.length) return;
    [ids[i], ids[j]] = [ids[j], ids[i]]; S.prio = ids;
    try { await saveSettings(); } catch (e) {}
  },
  'wi-preset': b => { ui.wi.extra = String((parseNum(ui.wi.extra) || 0) + Number(b.dataset.v)); $('wX').value = ui.wi.extra; $('wiOut').innerHTML = whatifOut(); },
  'wi-reset': () => { ui.wi = null; render(); },
  'wi-apply': async () => {
    const w = ui.wi, lj = parseNum(w.livingJob);
    S.plan = { ...planOf(), jobMonth: w.jobMonth, salary: parseNum(w.salary) || 0, livingJob: lj >= 0 ? lj : planOf().livingJob };
    ui.screen = 'plan'; try { await saveSettings(); toast('انحفظت الخطة'); } catch (e) { toast('ما انحفظ'); }
  },
  exportData: () => {
    const txt = JSON.stringify({ app: 'jaybti', v: 1, S: { ...S, pin: '' }, SAV, EXP });
    const show = () => openSheet(sheetHead('نسخ البيانات') + `<div class="form"><p class="hint">انسخ هالنص كله، وبالنسخة التانية من جيبتي روح على الإعدادات ← استيراد بيانات والصقه.</p><textarea class="ta" id="xT" readonly>${esc(txt)}</textarea></div>`, { kind: 'x' });
    try { navigator.clipboard.writeText(txt).then(() => toast('انسخت البيانات، الصقها بالنسخة التانية'), show); } catch (e) { show(); }
  },
  importData: () => openSheet(sheetHead('استيراد بيانات', 'import-save') + `<div class="form"><p class="hint">الصق هون النص اللي نسخته من "نسخ كل البيانات". البنود والإعدادات والمدخرات بتنستبدل، والمصاريف بتنضاف.</p><textarea class="ta" id="iT"></textarea><p class="err" id="sErr"></p></div>`, { kind: 'import' }),
  'import-save': async () => {
    let d; try { d = JSON.parse($('iT').value.trim()); } catch (e) { return err('النص مش كامل أو مش صحيح'); }
    if (d?.app !== 'jaybti' || !d.S) return err('هاد مش نص بيانات جيبتي');
    S = { ...defaults(), ...d.S, pin: S.pin };
    SAV = { moves: Array.isArray(d.SAV?.moves) ? d.SAV.moves : [], goals: Array.isArray(d.SAV?.goals) ? d.SAV.goals : [], debts: Array.isArray(d.SAV?.debts) ? d.SAV.debts : [], funds: Array.isArray(d.SAV?.funds) ? d.SAV.funds : [] };
    closeSheet(); toast('بستورد…');
    try {
      await saveSettings(); await saveSav();
      for (const e of (Array.isArray(d.EXP) ? d.EXP : [])) {
        const { id, ...body } = e;
        if (body.date && Number(body.amount) > 0) await putExp(String(id || '').replace(/[^A-Za-z0-9_-]/g, '') || null, body);
      }
      toast('انستوردت البيانات');
    } catch (e) { toast('صار خطأ بالاستيراد'); }
  },
  'pin-key': b => pinKey(b.dataset.k),
  'pin-cancel': () => { pinMode = null; pinBuf = ''; renderLock(); },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const f = A[b.dataset.act]; if (f) { e.preventDefault(); f(b); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('sheet').hidden) A.close();
  if (e.key === 'Enter' && e.target.id === 'qAmt') A['quick-save']();
  if (!$('lock').hidden && /^[0-9]$/.test(e.key)) pinKey(e.key);
  if (!$('lock').hidden && e.key === 'Backspace') pinKey('⌫');
});
document.addEventListener('input', e => {
  if (!e.target.closest('#wiForm') || !ui.wi) return;
  ui.wi = { jobMonth: $('wJ') ? $('wJ').value : ui.wi.jobMonth, salary: $('wS').value, extra: $('wX').value, livingJob: $('wL').value };
  $('wiOut').innerHTML = whatifOut();
});
$('qAmt').addEventListener('input', () => $('qSave').classList.toggle('on', !!ui.pick && parseNum($('qAmt').value) > 0));

let tt;
function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 1800); }

init();
</script>
</body>
